seed: 123
output_dir: outputs/sim/v2_literature
regime_name: v2_layers_literature

grid:
  # Match the lidocaine paper scale: ~0.5 mm skin over 24 h.
  H: 64
  W: 64
  dx: 0.0008
  dt: 0.2
  T: 86400.0
  save_every: 300

boundary:
  mode: infinite_dose
  C0: 1.0
  decay_rate: 0.0
  patch_width: 1.0
  patch_offset: center
  bottom: sink
  sides: neumann
  top_offpatch_mode: neumann

layers:
  # Top to bottom: SC, viable epidermis, dermis.
  # Thickness split chosen to reflect SC thin << dermis thick.
  layer_rows: [1, 9, 54]

  # Effective layer D values (cm^2/s), constrained by:
  # D_SC < D_VE < D_dermis.
  # These are calibrated to match lidocaine macro outputs (P, Tlag),
  # not claimed as unique measured per-layer constants.
  D_values: [1.3e-9, 1.0e-8, 2.0e-7]

  # Keep zero for compare runs unless a separate clearance study is done.
  k_dermis: 0.0

literature:
  source_primary: "Adamiak-Giera et al. (2023), Front Pharmacol, doi:10.3389/fphar.2023.1157977"
  source_context_1: "Prausnitz and Langer (2008), Nat Biotechnol, doi:10.1038/nbt.1504"
  source_context_2: "Ellison et al. (2020), Toxicol In Vitro, doi:10.1016/j.tiv.2020.104990"
  reference_doc: "docs/literature_layers_reference.md"
  P_target_cm_s: 7.38e-7
  Tlag_target_hours: 1.401
