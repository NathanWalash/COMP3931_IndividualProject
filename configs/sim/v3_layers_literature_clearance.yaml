seed: 123
output_dir: outputs/sim/v3_literature_clearance
regime_name: v3_layers_literature_clearance

grid:
  # Keep the same geometric/time scale used in the literature-anchored V3 setup.
  H: 64
  W: 64
  dx: 0.0008
  dt: 0.2
  T: 86400.0
  save_every: 300

boundary:
  # Finite-dose proxy via time-decaying donor.
  mode: time_decay
  C0: 1.0
  decay_rate: 0.2
  patch_width: 0.5
  patch_offset: center
  bottom: sink
  sides: neumann
  top_offpatch_mode: neumann

layers:
  # Top to bottom: SC, viable epidermis, dermis.
  layer_rows: [1, 9, 54]

  # Literature-constrained effective diffusion values (cm^2/s).
  D_values: [1.3e-9, 1.0e-8, 2.0e-7]

  # Initial clearance anchor for lidocaine sensitivity runs.
  # 0.12 h^-1 from literature maps to about 3.3e-5 s^-1.
  # Treat this as a modelling prior, not a fixed truth.
  k_dermis: 3.3e-5

heterogeneity:
  mode: correlated
  sigma: 0.05
  seed: 123
  D_min: 1.0e-10
  D_max: 5.0e-7
  steps: 5

literature:
  source_primary: "Adamiak-Giera et al. (2023), Front Pharmacol, doi:10.3389/fphar.2023.1157977"
  source_clearance_1: "Telaprolu et al. (2025), AAPS PharmSciTech, doi:10.1208/s12249-025-03232-2"
  source_clearance_2: "Maciel Tabosa et al. (2021), Drug Deliv Transl Res, doi:10.1007/s13346-020-00864-8"
  reference_doc: "docs/literature_layers_reference.md"
