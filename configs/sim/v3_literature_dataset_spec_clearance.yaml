# V3 literature-layer dataset spec with dermal clearance sensitivity.
# This spec is intended for black-box/PINN comparison with explicit k_dermis input.

version: v3_literature_dataset_clearance_v1
description: "Literature-layered V3 with finite-dose donor and sampled dermal clearance for sensitivity analysis"

base_config: configs/sim/v3_layers_literature_clearance.yaml
output_root: outputs/sim/v3_literature_dataset_clearance_v1

grid_policy:
  mode: fixed_from_base_config
  note: "H, W, dx, dt, T, save_every are fixed to the base V3 config"

sampling:
  num_runs:
    laptop:
      pilot: 120
      full_min: 500
      full_max: 1000
    lab_pc:
      pilot: 250
      full_min: 2000
      full_max: 5000
    cluster:
      pilot: 400
      full_min: 10000
      full_max: 25000

  parameters:
    patch_width:
      type: discrete
      values: [0.25, 0.5, 1.0]
    patch_offset:
      type: conditional_discrete
      values: [left, center, right]
      rule_when_patch_width_1p0: center
    C0:
      type: uniform
      min: 0.8
      max: 1.2
    decay_rate:
      type: uniform
      min: 0.05
      max: 0.3
    # Clearance levels are sensitivity choices centred around a literature anchor.
    # Units are 1/s.
    k_dermis:
      type: discrete
      values: [0.0, 1.0e-5, 3.3e-5, 1.0e-4]
    heterogeneity_mode:
      type: fixed
      value: correlated
    heterogeneity_sigma:
      type: uniform
      min: 0.01
      max: 0.08
    heterogeneity_steps:
      type: randint_inclusive
      min: 3
      max: 9

noise_policy:
  input_variability: true
  output_measurement_noise: false

splits:
  id:
    train_frac: 0.70
    val_frac: 0.15
    test_frac: 0.15
    split_seed: 321
  ood_primary:
    type: holdout
    parameter: patch_width
    value: 0.25

targets:
  # Primary set used for ML/PINN training reports.
  # Keep Tlag secondary for finite-dose runs.
  primary:
    - J_curve
    - P
    - J_ss
    - AUC_J
    - J_peak
    - t_peak
    - M_delivered_24h
  secondary:
    - Tlag
  demonstration:
    - full_field_single_run

evaluation_metrics:
  curve:
    - MAE
    - RMSE
    - relative_l2
    - integrated_absolute_error
    - pearson_r
  scalar:
    - MAE
    - RMSE
    - relative_error_percent
    - R2
  pinn_physics:
    - pde_residual
    - bc_violation
    - ic_violation
    - nonnegativity_violation_rate
  runtime:
    - train_wall_clock
    - inference_time_per_sample
    - throughput_samples_per_second
    - speedup_vs_simulator
