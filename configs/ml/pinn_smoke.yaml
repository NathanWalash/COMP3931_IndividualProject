version: pinn_v1_scaffold

# This file is the starting point for PINN training settings.
description: "PINN v1 scaffold config aligned with V3 finite-dose dataset"

model:
  hidden_layers: 4
  hidden_width: 128
  activation: tanh
  output_activation: softplus

training:
  seed: 321
  epochs: 5
  batch_size_data: 256
  batch_size_physics: 256
  grad_clip_norm: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 1.0e-4
  early_stop_metric: curve_rel_l2
  curve_eval_every: 1

optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0

loss_weights:
  data_curve: 1.0
  pde: 1.0
  bc: 1.0
  ic: 0.2
  flux_curve: 2.0
  nonnegativity: 0.1

physics:
  collocation_points_per_run: 128
  boundary_points_per_run: 64
  initial_points_per_run: 64
  flux_runs_per_batch: 1
  flux_time_points_per_run: 8
  flux_time_weighted_fraction: 0.7
  flux_time_weight_power: 1.0
  flux_rel_eps_quantile: 90.0
  flux_rel_residual_clip: 20.0
  curve_eval_runs: 4
  curve_eval_time_points: 24

runtime:
  device: auto
  num_workers: 0
