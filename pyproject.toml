[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transdermal-sim"
version = "0.1.0"
description = "2D finite-difference transdermal drug diffusion simulator with ML surrogate training"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
